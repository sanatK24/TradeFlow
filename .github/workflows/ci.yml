name: TradeFlow CI — Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Unit Tests (bond math, matching engine)
  # ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v -m unit --tb=short

  # ─────────────────────────────────────────────────────────
  # Job 2: API Integration Tests (FastAPI endpoints)
  # ─────────────────────────────────────────────────────────
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Run API tests with coverage
        run: |
          pytest tests/api/ -v -m api \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-report=xml:coverage.xml \
            --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # Job 3: E2E UI Tests (Playwright + live server)
  # ─────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E UI Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start backend server
        run: |
          python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8001 &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            curl -s http://localhost:8001/ && break
            sleep 1
          done

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 30); do
            curl -s http://localhost:5173/ && break
            sleep 1
          done

      - name: Run E2E tests
        run: pytest tests/e2e/ -v -m e2e --tb=short

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
